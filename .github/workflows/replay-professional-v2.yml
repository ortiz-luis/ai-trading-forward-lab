name: Build professional historical replays v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/replay_professional.py'
      - 'engine/replay_professional_runner.py'
      - 'prompts/replay_professional_v2.md'
      - 'tests/test_replay_professional.py'
      - '.github/workflows/replay-professional-v2.yml'

permissions:
  contents: write

concurrency:
  group: ai-trading-replay-v2
  cancel-in-progress: false

jobs:
  replay-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Run acceptance tests
        run: python -m pytest -q

      - name: Generate professional blind replays
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m engine.replay_professional_runner

      - name: Assert forward state stayed untouched
        run: |
          git diff --exit-code -- data/decisions.jsonl data/evaluations.jsonl data/cohort_v1.json || {
            echo 'Professional replay attempted to modify forward state.'
            exit 1
          }

      - name: Persist replay v2 artifact
        run: |
          if [ -z "$(git status --porcelain -- data/replay_v2/)" ]; then
            echo 'Professional replay artifact unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/replay_v2/index.json
          git commit -m 'replay: refresh professional v2 sessions'
          git pull --rebase origin main
          git push origin HEAD:main

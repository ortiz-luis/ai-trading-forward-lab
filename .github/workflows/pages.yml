name: Deploy public dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .[dev]
      - name: Run acceptance tests
        run: python -m pytest -q
      - name: Build sanitized dashboard
        run: |
          python - <<'PY'
          from engine.public_data import build_public_dashboard
          build_public_dashboard(
              decisions_path='data/decisions.jsonl',
              evaluations_path='data/evaluations.jsonl',
              health_path='data/health.json',
              output_path='data/public/dashboard.json',
          )
          PY
      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp app/index.html app/styles.css app/app.js _site/
          cp data/public/dashboard.json _site/data/dashboard.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

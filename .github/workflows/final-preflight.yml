name: Final cohort preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Acceptance suite
        run: python -m pytest -q
      - name: Required secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        shell: bash
        run: |
          missing=0
          for name in OPENAI_API_KEY ALPACA_API_KEY ALPACA_API_SECRET; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
              missing=1
            fi
          done
          exit "$missing"
